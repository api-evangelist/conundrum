aid: conundrum
name: Conundrum
description: >-
  Conundrum (Conundrum Industrial Ltd, Cambridge, UK) is an industrial AI company building AI-driven,
  closed-loop advanced process control (APC) and model predictive control (MPC) software for the metals,
  mining, and cement industries. Its platform combines physics-informed and machine-learning models with
  real-time controllers, optimizers, data-quality tooling, interactive process-flow diagrams, drag-and-drop
  dashboards, and a Python SDK for building configurable runtime applications. Conundrum optimizes crushing,
  grinding, flotation, and cement processes to raise throughput and metal recovery while reducing energy
  consumption, deployed on-premises or in the cloud across plants running 24/7. The company is backed by
  Speedinvest and reports deployments across multiple plants in several countries.
